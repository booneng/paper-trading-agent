name: paper-trading-agent

on:
  schedule:
    - cron: "7 * * * *"      # every hour, 7 minutes after the hourly candle closes
  workflow_dispatch: {}       # "Run workflow" button for a manual run

permissions:
  contents: write             # lets the job commit state, trades and journal back to the repo
  issues: write               # lets the job post trade alerts to the "Trade alerts" issue

concurrency:
  group: paper-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Chrome-compatible web client for Yahoo Finance (optional)
        run: pip install --quiet curl_cffi || echo "curl_cffi unavailable - using the built-in client"

      - name: Run one trading cycle (and the daily learning step when due)
        run: |
          mkdir -p logs reports
          cp journal.md "$RUNNER_TEMP/journal.before" 2>/dev/null || : > "$RUNNER_TEMP/journal.before"
          python3 paper_agent.py run --once 2>&1 | tee -a logs/agent.log
          python3 paper_agent.py status | tee status.txt

      - name: Save state, trades, journal and reports to the repo
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "paper-trading-bot@users.noreply.github.com"
          tail -n 3000 logs/agent.log > logs/agent.tmp && mv logs/agent.tmp logs/agent.log
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Trading cycle $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs && git push -q && exit 0
            sleep 5
          done
          exit 1

      - name: Alert on new trades (comment on the "Trade alerts" issue; GitHub notifies you)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/trade_alerts.py "$RUNNER_TEMP/journal.before" journal.md status.txt > "$RUNNER_TEMP/alert.md"
          if [ ! -s "$RUNNER_TEMP/alert.md" ]; then echo "No new trades."; exit 0; fi
          cat "$RUNNER_TEMP/alert.md"
          n=$(gh issue list --state open --limit 200 --json number,title --jq '[.[] | select(.title == "Trade alerts")][0].number // empty')
          if [ -z "$n" ]; then
            n=$(gh issue create --title "Trade alerts" --body "Each new paper trade is posted here as a comment, with its reasoning." | grep -o '[0-9]*$')
          fi
          gh issue comment "$n" --body-file "$RUNNER_TEMP/alert.md"
